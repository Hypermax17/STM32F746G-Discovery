name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # fuer "git describe" (Version im Boot-Banner)

      - name: Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      # Baut die normale Applikation und alle Fehlertest-Varianten (je Release)
      - name: Alle Programmvarianten bauen
        run: scripts/build_variants.sh

      # Ein einziges Artefakt, das nur die .hex-Dateien aller Varianten enthaelt
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: stm32f746g-hex
          path: dist/*.hex
          if-no-files-found: error
